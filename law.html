<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criminal Law Information</title>
    <style>
        :root {
            --primary-red: #8B0000;
            --sidebar-bg: #ffffff;
            --main-bg: #f4f6f8;
            --border: #e0e0e0;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--main-bg);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar UI */
        .sidebar {
            width: 380px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 30px;
            box-sizing: border-box;
            z-index: 10;
        }

        /* The Requested Title Style */
        .main-title {
            color: var(--primary-red);
            margin: 0 0 20px 0;
            font-size: 1.8rem;
            display: inline-block;
            border-bottom: 4px solid var(--primary-red); /* Red border below title */
            padding-bottom: 5px;
        }

        .input-group {
            margin-bottom: 25px;
            position: relative;
            margin-top: 10px;
        }

        label {
            font-size: 0.75rem;
            font-weight: 800;
            color: #666;
            margin-bottom: 8px;
            display: block;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        /* Custom Dropdown Container */
        .search-container {
            position: relative;
        }

        #arrow-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--primary-red);
            font-size: 1.2rem;
            transition: 0.3s;
        }

        .dropdown-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            max-height: 250px;
            overflow-y: auto;
            display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            z-index: 100;
            margin-top: 5px;
        }

        .dropdown-item {
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid #f9f9f9;
            transition: background 0.2s;
        }

        .dropdown-item:hover {
            background-color: #fff5f5;
            color: var(--primary-red);
        }

        /* Main Content View */
        .main-view {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            justify-content: center;
        }

        .report {
            background: white;
            width: 100%;
            max-width: 750px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            display: none;
            border-top: 6px solid var(--primary-red);
        }

        .section { margin-bottom: 25px; }
        .section h4 { color: #888; font-size: 0.8rem; margin: 0 0 5px; text-transform: uppercase; }
        .section p { margin: 0; font-size: 1.1rem; color: #333; font-weight: 500; }

        .badge {
            padding: 5px 12px;
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 20px;
            display: inline-block;
        }
        .juv { background: #e8f5e9; color: #2e7d32; }
        .adu { background: #ffebee; color: #c62828; }

        .placeholder-text { color: #aaa; text-align: center; margin-top: 100px; }
    </style>
</head>
<body>

<div class="sidebar">
    <h1 class="main-title">Criminal Law Information</h1>
    
    <div class="input-group">
        <label>1. ACCUSED AGE</label>
        <input type="number" id="age-input" placeholder="Enter age...">
    </div>

    <div class="input-group">
        <label>2. CRIMINAL CASE</label>
        <div class="search-container">
            <input type="text" id="crime-input" placeholder="Search or select..." autocomplete="off">
            <span id="arrow-btn">▼</span>
            <div id="dropdown" class="dropdown-list">
                </div>
        </div>
    </div>
    
    <p style="font-size: 0.7rem; color: #999; margin-top: auto;">© 2026 BNS/IPC Legal Analysis Tool</p>
</div>

<div class="main-view">
    <div id="placeholder" class="placeholder-text">
        <h3>Please enter age and select a case from the sidebar.</h3>
    </div>

    <div id="report-card" class="report">
        <div id="age-badge" class="badge"></div>
        <h1 id="res-title" style="margin: 0 0 25px 0;"></h1>
        
        <div class="section">
            <h4>Legal Code</h4>
            <p id="res-code"></p>
        </div>
        <div class="section">
            <h4>Punishment Details</h4>
            <p id="res-punish"></p>
        </div>
        <div class="section">
            <h4>Financial Fine</h4>
            <p id="res-fine"></p>
        </div>
        <div class="section">
            <h4>Victim Compensation</h4>
            <p id="res-victim"></p>
        </div>
    </div>
</div>

<script>
const casesData = {
    "Theft": { code: "Sec 303 BNS (Old 378 IPC)", punish: "Up to 3 years or fine.", fine: "Proportional to value.", victim: "Restitution of property." },
    "Murder": { code: "Sec 103 BNS (Old 302 IPC)", punish: "Life imprisonment or Death Penalty.", fine: "Court discretion.", victim: "Victim Compensation Scheme." },
    "Assault": { code: "Sec 115 BNS (Old 351 IPC)", punish: "1-7 years based on hurt.", fine: "Medical expense fine.", victim: "Medical reimbursement." },
    "Cyber Crime": { code: "IT Act 2000, Sec 66", punish: "3 years to Life.", fine: "Up to 5 Lakhs+.", victim: "IT Adjudicator damages." },
    "Drug Trafficking": { code: "NDPS Act, 1985", punish: "10-20 years rigorous jail.", fine: "Min ₹1,00,000.", victim: "State rehab access." },
    "Domestic Violence": { code: "DV Act 2005 / BNS Sec 85", punish: "Up to 3 years jail.", fine: "Maintenance costs.", victim: "Protection orders." },
    "Fraud": { code: "Sec 318 BNS (Old 420 IPC)", punish: "Up to 7 years.", fine: "Based on loss.", victim: "Civil recovery." },
    "Extortion": { code: "Sec 308 BNS", punish: "Up to 7 years.", fine: "Penal fine.", victim: "Asset recovery." },
    "Robbery": { code: "Sec 309 BNS", punish: "Up to 10 years.", fine: "Mandatory fine.", victim: "Medical care." },
    "Kidnapping": { code: "Sec 137 BNS", punish: "Up to 7 years.", fine: "Variable.", victim: "Counseling." },
    "Forgery": { code: "Sec 336 BNS", punish: "Up to 2 years.", fine: "Standard fine.", victim: "Doc cancellation." },
    "Counterfeiting": { code: "Sec 178 BNS", punish: "7 years to Life.", fine: "Max penalty.", victim: "Prosecution support." },
    "Defamation": { code: "Sec 356 BNS", punish: "Up to 2 years.", fine: "Compensation.", victim: "Public apology." },
    "Trespass": { code: "Sec 329 BNS", punish: "Up to 3 months.", fine: "Nominal.", victim: "Injunction." },
    "Bribery": { code: "P.C. Act, 1988", punish: "3-7 years.", fine: "Asset confiscation.", victim: "Public interest." }
};

const crimeInput = document.getElementById('crime-input');
const dropdown = document.getElementById('dropdown');
const arrowBtn = document.getElementById('arrow-btn');

function populateDropdown(filter = "") {
    dropdown.innerHTML = "";
    Object.keys(casesData).forEach(crime => {
        if (crime.toLowerCase().includes(filter.toLowerCase())) {
            const item = document.createElement('div');
            item.className = 'dropdown-item';
            item.innerText = crime;
            item.onclick = () => selectCrime(crime);
            dropdown.appendChild(item);
        }
    });
}

function selectCrime(crime) {
    crimeInput.value = crime;
    dropdown.style.display = 'none';
    showAnalysis();
}

arrowBtn.onclick = (e) => {
    e.stopPropagation();
    const isVisible = dropdown.style.display === 'block';
    populateDropdown();
    dropdown.style.display = isVisible ? 'none' : 'block';
};

crimeInput.oninput = () => {
    dropdown.style.display = 'block';
    populateDropdown(crimeInput.value);
    showAnalysis();
};

document.onclick = () => dropdown.style.display = 'none';

function showAnalysis() {
    const age = parseInt(document.getElementById('age-input').value);
    const crime = crimeInput.value;
    const report = document.getElementById('report-card');
    const placeholder = document.getElementById('placeholder');

    if (!age || !casesData[crime]) {
        report.style.display = 'none';
        placeholder.style.display = 'block';
        return;
    }

    placeholder.style.display = 'none';
    report.style.display = 'block';
    
    const data = casesData[crime];
    document.getElementById('res-title').innerText = crime.toUpperCase();
    document.getElementById('res-code').innerText = data.code;
    document.getElementById('res-fine').innerText = data.fine;
    document.getElementById('res-victim').innerText = data.victim;

    const badge = document.getElementById('age-badge');
    if (age < 18) {
        badge.innerText = "JUVENILE CASE";
        badge.className = "badge juv";
        if (age >= 16 && (crime === 'Murder' || crime === 'Drug Trafficking')) {
             document.getElementById('res-punish').innerHTML = "<strong>HEINOUS OFFENSE:</strong> For ages 16-18, the JJ Board may decide to try the minor as an adult.";
        } else {
             document.getElementById('res-punish').innerText = "Rehabilitation focus. Max 3 years in a Reformatory Home.";
        }
    } else {
        badge.innerText = "ADULT CASE";
        badge.className = "badge adu";
        document.getElementById('res-punish').innerText = data.punish;
    }
}

document.getElementById('age-input').oninput = showAnalysis;
populateDropdown();
</script>
</body>
</html>

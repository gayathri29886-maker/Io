<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criminal Law Dashboard</title>
    <style>
        :root {
            --primary-red: #8B0000;
            --sidebar-bg: #ffffff;
            --main-bg: #f8f9fa;
            --border-color: #ddd;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--main-bg);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: var(--primary-red);
            color: white;
            padding: 15px 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        /* Dashboard Layout */
        .dashboard {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        /* Left Sidebar (Input) */
        .sidebar {
            width: 350px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            padding: 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        /* Right Content (Results) */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .input-group {
            position: relative;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #444;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: var(--primary-red);
            outline: none;
        }
        /* The Report Card Style */
        .report-card {
            background: white;
            width: 100%;
            max-width: 700px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 40px;
            display: none; /* Hidden until search */
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .empty-state {
            color: #999;
            text-align: center;
            margin-top: 100px;
        }
        .badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .juv-badge { background: #e8f5e9; color: #2e7d32; }
        .adu-badge { background: #ffebee; color: #c62828; }

        .law-section {
            margin-bottom: 25px;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 15px;
        }
        .law-section h3 {
            font-size: 0.8rem;
            color: #888;
            margin: 0 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .law-section p {
            font-size: 1.1rem;
            margin: 0;
            color: #222;
            font-weight: 500;
        }

        @media (max-width: 800px) {
            .dashboard { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border-color); }
        }
    </style>
</head>
<body>

<header>
    <h2 style="margin:0;">Legal Analytics Engine</h2>
</header>

<div class="dashboard">
    <div class="sidebar">
        <div class="input-group">
            <label>ENTER AGE</label>
            <input type="number" id="age-input" placeholder="e.g. 24">
        </div>

        <div class="input-group">
            <label>SEARCH CRIMINAL CASE</label>
            <input list="crime-options" id="crime-search" placeholder="Type to filter list...">
            <datalist id="crime-options">
                <option value="Theft">
                <option value="Extortion">
                <option value="Robbery">
                <option value="Murder">
                <option value="Kidnapping">
                <option value="Assault">
                <option value="Fraud (Cheating)">
                <option value="Forgery">
                <option value="Counterfeiting">
                <option value="Cyber Crime">
                <option value="Drug Trafficking">
                <option value="Domestic Violence">
                <option value="Bribery/Corruption">
                <option value="Defamation">
                <option value="Trespass">
            </datalist>
        </div>
        <p style="font-size: 0.75rem; color: #999;">* Select a case from the list to generate the report on the right.</p>
    </div>

    <div class="main-content">
        <div id="empty-msg" class="empty-state">
            <p>Waiting for selection...<br>Enter an age and choose a criminal case to begin analysis.</p>
        </div>

        <div id="report" class="report-card">
            <div id="status-badge" class="badge"></div>
            <h1 id="crime-title" style="margin: 0 0 30px 0; color: var(--primary-red); border-bottom: 3px solid var(--primary-red); display: inline-block;"></h1>
            
            <div class="law-section">
                <h3>Statutory Provision</h3>
                <p id="law-code"></p>
            </div>

            <div class="law-section">
                <h3>Prescribed Punishment</h3>
                <p id="law-punishment"></p>
            </div>

            <div class="law-section">
                <h3>Financial Liability (Fine)</h3>
                <p id="law-fine"></p>
            </div>

            <div class="law-section">
                <h3>Victim Rights & Compensation</h3>
                <p id="law-victim"></p>
            </div>
        </div>
    </div>
</div>

<script>
const casesData = {
    "theft": { code: "Sec 303 BNS (Formerly 378 IPC)", punish: "Up to 3 years imprisonment, fine, or both.", fine: "Varies by value of property.", victims: "Restitution of property." },
    "extortion": { code: "Sec 308 BNS (Formerly 383 IPC)", punish: "Up to 7 years imprisonment and fine.", fine: "Significant penal fine.", victims: "Recovery of extorted assets." },
    "robbery": { code: "Sec 309 BNS (Formerly 390 IPC)", punish: "Rigorous imprisonment up to 10 years.", fine: "Hefty fine mandatory.", victims: "Medical care + asset recovery." },
    "murder": { code: "Sec 103 BNS (Formerly 302 IPC)", punish: "Life imprisonment or Death Penalty.", fine: "Court-ordered compensation.", victims: "State victim compensation scheme." },
    "kidnapping": { code: "Sec 137 BNS (Formerly 359 IPC)", punish: "Up to 7 years and fine.", fine: "Variable court fine.", victims: "Rehabilitation and counseling." },
    "assault": { code: "Sec 115 BNS (Formerly 351 IPC)", punish: "Varies (1 - 7 years) based on injury.", fine: "Medical cost coverage.", victims: "Medical reimbursement." },
    "fraud (cheating)": { code: "Sec 318 BNS (Formerly 420 IPC)", punish: "Up to 7 years imprisonment.", fine: "Proportional to fraud amount.", victims: "Civil damages recovery." },
    "forgery": { code: "Sec 336 BNS (Formerly 463 IPC)", punish: "Up to 2 years or fine.", fine: "Standard penalty.", victims: "Legal document nullification." },
    "counterfeiting": { code: "Sec 178 BNS (Formerly 231 IPC)", punish: "7 years up to Life imprisonment.", fine: "Maximum penal fine.", victims: "National security prosecution." },
    "cyber crime": { code: "IT Act, 2000 (Section 66)", punish: "3 years to Life (Cyber Terrorism).", fine: "High financial penalties.", victims: "IT Cell adjudication." },
    "drug trafficking": { code: "NDPS Act, 1985", punish: "10-20 years rigorous imprisonment.", fine: "Minimum ₹1,00,000.", victims: "Drug rehabilitation access." },
    "domestic violence": { code: "DV Act 2005 / BNS Sec 85", punish: "Up to 3 years imprisonment.", fine: "Maintenance/Medical costs.", victims: "Residence & Protection orders." },
    "bribery/corruption": { code: "P.C. Act, 1988", punish: "3 to 7 years imprisonment.", fine: "Confiscation of property.", victims: "Public accountability." },
    "defamation": { code: "Sec 356 BNS (Formerly 499 IPC)", punish: "Simple imprisonment (2 yrs) or fine.", fine: "Compensation to aggrieved.", victims: "Right to public apology." },
    "trespass": { code: "Sec 329 BNS (Formerly 441 IPC)", punish: "Up to 3 months or fine.", fine: "Nominal penalty.", victims: "Property injunctions." }
};

function generateReport() {
    const age = parseInt(document.getElementById('age-input').value);
    const crimeKey = document.getElementById('crime-search').value.toLowerCase().trim();
    
    const reportCard = document.getElementById('report');
    const emptyMsg = document.getElementById('empty-msg');

    if (!age || !crimeKey || !casesData[crimeKey]) {
        reportCard.style.display = 'none';
        emptyMsg.style.display = 'block';
        return;
    }

    const data = casesData[crimeKey];
    emptyMsg.style.display = 'none';
    reportCard.style.display = 'block';

    // Update Content
    document.getElementById('crime-title').innerText = crimeKey.toUpperCase();
    document.getElementById('law-code').innerText = data.code;
    document.getElementById('law-fine').innerText = data.fine;
    document.getElementById('law-victim').innerText = data.victims;

    // Age Analysis
    const badge = document.getElementById('status-badge');
    if (age < 18) {
        badge.innerText = `Juvenile (Age ${age})`;
        badge.className = "badge juv-badge";
        
        // 16-18 Heinous Crime Check
        if (age >= 16 && (crimeKey === 'murder' || crimeKey === 'drug trafficking')) {
            document.getElementById('law-punishment').innerHTML = "<strong>HEINOUS OFFENSE EXCEPTION:</strong> Due to the gravity of the crime, the Juvenile Justice Board may order the minor (16-18) to be tried as an adult.";
        } else {
            document.getElementById('law-punishment').innerText = "Rehabilitation focus. Maximum 3 years in a Special Home under Juvenile Justice Act. No standard prison.";
        }
    } else {
        badge.innerText = `Adult (Age ${age})`;
        badge.className = "badge adu-badge";
        document.getElementById('law-punishment').innerText = data.punish;
    }
}

document.getElementById('age-input').addEventListener('input', generateReport);
document.getElementById('crime-search').addEventListener('input', generateReport);
</script>

</body>
</html>

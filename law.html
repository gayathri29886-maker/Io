<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --primary-red: #8B0000;
            --sidebar-bg: #ffffff;
            --main-bg: #f4f6f8;
            --border: #e0e0e0;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--main-bg);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Banner */
        .top-banner {
            background-color: var(--primary-red);
            color: white;
            text-align: center;
            padding: 12px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 20;
        }
        .top-banner h1 {
            margin: 0;
            font-family: 'Brush Script MT', cursive, sans-serif;
            font-size: 2.8rem;
            font-weight: normal;
        }

        .dashboard {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 400px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 25px;
            box-sizing: border-box;
        }
        .sidebar-title {
            color: var(--primary-red);
            margin: 0 0 10px 0;
            font-size: 1.6rem;
            font-weight: bold;
            border-bottom: 4px solid var(--primary-red);
            padding-bottom: 8px;
            width: fit-content;
        }

        .input-group { margin-bottom: 15px; position: relative; }
        label { font-size: 0.7rem; font-weight: 800; color: #666; margin-bottom: 5px; display: block; }
        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
        }

        /* Search Dropdown */
        .search-container { position: relative; }
        #arrow-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--primary-red); }
        .dropdown-list {
            position: absolute;
            top: 100%; left: 0; right: 0;
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            max-height: 400px;
            overflow-y: auto;
            display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            z-index: 100;
            margin-top: 5px;
        }
        .dropdown-item { padding: 8px 15px; cursor: pointer; border-bottom: 1px solid #f9f9f9; font-size: 0.85rem; }
        .dropdown-item:hover { background-color: #fff5f5; color: var(--primary-red); }

        /* Main Content */
        .main-view { flex: 1; padding: 30px; overflow-y: auto; display: flex; justify-content: center; }
        .report {
            background: white;
            width: 100%;
            max-width: 800px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            display: none;
            border-top: 6px solid var(--primary-red);
        }

        .section { margin-bottom: 15px; border-bottom: 1px solid #f9f9f9; padding-bottom: 10px; }
        .section h4 { color: #888; font-size: 0.7rem; margin: 0 0 3px; text-transform: uppercase; }
        .section p { margin: 0; font-size: 0.95rem; color: #333; line-height: 1.4; }

        .badge { padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; margin-bottom: 15px; display: inline-block; }
        .juv { background: #e8f5e9; color: #2e7d32; }
        .adu { background: #ffebee; color: #c62828; }
        .placeholder-text { color: #aaa; text-align: center; margin-top: 100px; }
    </style>

            <div class="search-container">

                <span id="arrow-btn">▼</span>
                <div id="dropdown" class="dropdown-list"></div>
            </div>
        </div>
        
        <p style="font-size: 0.65rem; color: #999; margin-top: auto;">Updated for 2026 Legal Standards.</p>
    </div>

    <div class="main-view">

    </div>
</div>

const crimeInput = document.getElementById('crime-input');
const dropdown = document.getElementById('dropdown');
const arrowBtn = document.getElementById('arrow-btn');

function populateDropdown(filter = "") {
    dropdown.innerHTML = "";
    const keys = Object.keys(casesData).sort();
    keys.forEach(crime => {
        if (crime.toLowerCase().includes(filter.toLowerCase())) {
            const item = document.createElement('div');
            item.className = 'dropdown-item';
            item.innerText = crime;
            item.onclick = () => { crimeInput.value = crime; dropdown.style.display = 'none'; showAnalysis(); };
            dropdown.appendChild(item);
        }
    });
}

arrowBtn.onclick = (e) => { e.stopPropagation(); dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block'; populateDropdown(); };
crimeInput.oninput = () => { dropdown.style.display = 'block'; populateDropdown(crimeInput.value); showAnalysis(); };
document.onclick = () => dropdown.style.display = 'none';

function showAnalysis() {
    const age = parseInt(document.getElementById('age-input').value);
    const crime = crimeInput.value;
    if (!age || !casesData[crime]) return;

    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('report-card').style.display = 'block';
    
    const data = casesData[crime];
    document.getElementById('res-title').innerText = crime.toUpperCase();
    document.getElementById('res-code').innerText = data.code;
    document.getElementById('res-fine').innerText = data.fine;
    document.getElementById('res-victim').innerText = data.victim;

    const badge = document.getElementById('age-badge');
    if (age < 18) {
        badge.innerText = "JUVENILE CASE"; badge.className = "badge juv";
        document.getElementById('res-punish').innerText = "Rehabilitation focus. Max 3 years in a Reformatory Home under Juvenile Justice Act.";
    } else {
        badge.innerText = "ADULT CASE"; badge.className = "badge adu";
        document.getElementById('res-punish').innerText = data.punish;
    }
}
document.getElementById('age-input').oninput = showAnalysis;
populateDropdown();

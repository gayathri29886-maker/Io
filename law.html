<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criminal Law Info & Age Analysis</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            background-color: #8B0000;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            width: 90%;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }
        select, input[type="number"] {
            padding: 12px;
            font-size: 1rem;
            border: 2px solid #ddd;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        select:focus, input:focus {
            border-color: #8B0000;
            outline: none;
        }
        .result {
            margin-top: 30px;
            padding: 20px;
            border-left: 5px solid #8B0000;
            background-color: #fff9f9;
            display: none;
        }
        .juvenile-badge {
            background-color: #2e7d32;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.9em;
            display: inline-block;
            margin-bottom: 10px;
        }
        .adult-badge {
            background-color: #c62828;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.9em;
            display: inline-block;
            margin-bottom: 10px;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

<header>
    <h1>Criminal Law Information Portal</h1>
    <p>Legal Guidance based on Case Type and Age</p>
</header>

<div class="container">
    <div class="input-group">
        <label for="user-age">Step 1: Enter Age of the Accused</label>
        <input type="number" id="user-age" placeholder="Enter age (e.g. 21)" min="1" max="110">
    </div>

    <div class="input-group">
        <label for="crime-select">Step 2: Select a Criminal Case</label>
        <select id="crime-select">
            <option value="">--Select a Case--</option>
            <option value="theft">Theft</option>
            <option value="assault">Assault</option>
            <option value="murder">Murder</option>
            <option value="robbery">Robbery</option>
            <option value="fraud">Fraud (Cheating)</option>
            <option value="domestic-violence">Domestic Violence</option>
            <option value="drug-trafficking">Drug Trafficking</option>
        </select>
    </div>

    <div id="result" class="result">
        </div>
</div>

<footer>
    <p>&copy; 2026 Criminal Law Database. Consult a lawyer for legal advice.</p>
</footer>

<script>
const casesData = {
    theft: {
        law: "Section 303 of BNS (Formerly Sec 378 IPC)",
        punishment: "Imprisonment up to 3 years, or fine, or both.",
        fine: "Varies based on stolen value.",
        compensation: "Victims may seek restoration of property."
    },
    assault: {
        law: "Section 115 of BNS (Formerly Sec 351 IPC)",
        punishment: "Varies from 1 year to 7 years depending on hurt caused.",
        fine: "Dependent on medical expenses and severity.",
        compensation: "Victims can claim medical cost coverage."
    },
    murder: {
        law: "Section 103 of BNS (Formerly Sec 302 IPC)",
        punishment: "Life imprisonment or death penalty.",
        fine: "Court-discretionary fine for victim's family.",
        compensation: "State-funded victim compensation schemes apply."
    },
    robbery: {
        law: "Section 309 of BNS (Formerly Sec 390 IPC)",
        punishment: "Rigorous imprisonment up to 10 years and fine.",
        fine: "Substantial fines usually imposed.",
        compensation: "Restitution of stolen assets."
    },
    fraud: {
        law: "Section 318 of BNS (Formerly Sec 420 IPC)",
        punishment: "Imprisonment up to 7 years and fine.",
        fine: "Proportional to the amount of financial loss.",
        compensation: "Civil suits can run parallel for recovery."
    },
    "domestic-violence": {
        law: "DV Act, 2005 & BNS Section 85",
        punishment: "Up to 3 years imprisonment.",
        fine: "Includes maintenance and medical costs.",
        compensation: "Right to reside in shared household and monetary relief."
    },
    "drug-trafficking": {
        law: "NDPS Act, 1985",
        punishment: "10 to 20 years rigorous imprisonment.",
        fine: "₹1 Lakh to ₹2 Lakhs minimum.",
        compensation: "Rehabilitation support for victims."
    }
};

function updateDisplay() {
    const ageInput = document.getElementById("user-age").value;
    const crimeType = document.getElementById("crime-select").value;
    const resultDiv = document.getElementById("result");

    if (!ageInput || !crimeType) {
        resultDiv.style.display = "none";
        return;
    }

    const age = parseInt(ageInput);
    const info = casesData[crimeType];
    resultDiv.style.display = "block";

    let ageBracketHtml = "";
    let finalPunishment = "";

    // Juvenile Justice Logic
    if (age < 18) {
        ageBracketHtml = `<span class="juvenile-badge">JUVENILE CASE (Under 18)</span>`;
        if (age >= 16 && (crimeType === 'murder' || crimeType === 'drug-trafficking')) {
            finalPunishment = "<strong>Heinous Offense:</strong> Under JJ Act, the Juvenile Justice Board may decide to try the minor as an adult. Otherwise, max 3 years in a Reformatory.";
        } else {
            finalPunishment = "No jail. Sent to an Observation Home/Special Home for max 3 years. Focus on rehabilitation.";
        }
    } else {
        ageBracketHtml = `<span class="adult-badge">ADULT CASE (18+)</span>`;
        finalPunishment = info.punishment;
    }

    resultDiv.innerHTML = `
        ${ageBracketHtml}
        <h2 style="margin-top:5px;">${crimeType.replace('-', ' ').toUpperCase()}</h2>
        <p><strong>Primary Statute:</strong> ${info.law}</p>
        <p><strong>Legal Consequences:</strong> ${finalPunishment}</p>
        <p><strong>Financial Penalties:</strong> ${info.fine}</p>
        <p><strong>Victim Rights:</strong> ${info.compensation}</p>
        <p style="font-size:0.85em; color:#666; font-style:italic; margin-top:15px;">
            Note: For an individual aged ${age}, the ${age < 18 ? 'Juvenile Justice (Care and Protection of Children) Act' : 'Bharatiya Nyaya Sanhita'} is the governing framework.
        </p>
    `;
}

// Event Listeners
document.getElementById("user-age").addEventListener("input", updateDisplay);
document.getElementById("crime-select").addEventListener("change", updateDisplay);

</script>

</body>
</html>

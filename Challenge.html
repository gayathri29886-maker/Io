<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Platformer</title>
    <style>
        body { margin: 0; background: #5c94fc; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { background: #5c94fc; border: 2px solid #000; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 800;
        canvas.height = 400;

        // Game Constants
        const gravity = 0.5;
        const keys = { right: false, left: false, up: false };

        class Player {
            constructor() {
                this.width = 30;
                this.height = 30;
                this.position = { x: 100, y: 100 };
                this.velocity = { x: 0, y: 0 };
            }

            draw() {
                ctx.fillStyle = 'red'; // Mario color!
                ctx.fillRect(this.position.x, this.position.y, this.width, this.height);
            }

            update() {
                this.draw();
                this.position.x += this.velocity.x;
                this.position.y += this.velocity.y;

                // Gravity Logic: v_y = v_y + g
                if (this.position.y + this.height + this.velocity.y <= canvas.height) {
                    this.velocity.y += gravity;
                } else {
                    this.velocity.y = 0; // Stop falling when hitting bottom
                }
            }
        }

        const mario = new Player();

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Movement Logic
            mario.velocity.x = 0;
            if (keys.right) mario.velocity.x = 5;
            if (keys.left) mario.velocity.x = -5;

            mario.update();
        }

        // Input Listeners
        window.addEventListener('keydown', ({ keyCode }) => {
            if (keyCode === 68) keys.right = true;  // 'D' key
            if (keyCode === 65) keys.left = true;   // 'A' key
            if (keyCode === 87 || keyCode === 32) { // 'W' or Space
                if (mario.velocity.y === 0) mario.velocity.y = -15; // Jump
            }
        });

        window.addEventListener('keyup', ({ keyCode }) => {
            if (keyCode === 68) keys.right = false;
            if (keyCode === 65) keys.left = false;
        });

        animate();
    </script>
</body>
</html>

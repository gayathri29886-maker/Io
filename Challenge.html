<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fixed Mario Clone</title>
    <style>
        body { margin: 0; background: #5c94fc; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; font-family: 'Arial', sans-serif; }
        canvas { background: #5c94fc; border: 4px solid #000; }
        .ui { position: absolute; top: 20px; color: white; font-size: 24px; text-shadow: 2px 2px #000; }
    </style>
</head>
<body>
    <div class="ui">Score: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 800;
        canvas.height = 400;

        const gravity = 0.8;
        const keys = { right: false, left: false };
        let scrollOffset = 0;
        let score = 0;

        class Player {
            constructor() {
                this.width = 30;
                this.height = 40;
                this.position = { x: 100, y: 100 };
                this.velocity = { x: 0, y: 0 };
                this.speed = 6;
            }

            draw() {
                // Mario Body
                ctx.fillStyle = "#FF0000"; // Hat/Shirt
                ctx.fillRect(this.position.x, this.position.y, this.width, 15);
                ctx.fillStyle = "#0000FF"; // Overalls
                ctx.fillRect(this.position.x, this.position.y + 15, this.width, 20);
                ctx.fillStyle = "#FFCC99"; // Face
                ctx.fillRect(this.position.x + 10, this.position.y + 5, 15, 10);
                ctx.fillStyle = "#000"; // Eyes
                ctx.fillRect(this.position.x + 20, this.position.y + 7, 3, 3);
            }

            update() {
                this.draw();
                this.position.x += this.velocity.x;
                this.position.y += this.velocity.y;

                // Basic gravity
                if (this.position.y + this.height + this.velocity.y <= canvas.height) {
                    this.velocity.y += gravity;
                } else {
                    // Reset if falls off screen
                    this.reset();
                }
            }

            reset() {
                this.position = { x: 100, y: 100 };
                this.velocity = { x: 0, y: 0 };
                scrollOffset = 0;
                score = 0;
                document.getElementById('score').innerText = 0;
                // Re-create starting ground
                platforms = [
                    new Platform({ x: 0, y: 350, width: 600, height: 50 }),
                    new Platform({ x: 700, y: 250, width: 200, height: 20 })
                ];
            }
        }

        class Platform {
            constructor({ x, y, width, height }) {
                this.position = { x, y };
                this.width = width;
                this.height = height;
            }
            draw() {
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(this.position.x + scrollOffset, this.position.y, this.width, this.height);
                ctx.fillStyle = '#228B22'; // Grass top
                ctx.fillRect(this.position.x + scrollOffset, this.position.y, this.width, 10);
            }
        }

        let mario = new Player();
        let platforms = [
            new Platform({ x: 0, y: 350, width: 600, height: 50 }),
            new Platform({ x: 700, y: 250, width: 200, height: 20 })
        ];

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            platforms.forEach(platform => {
                platform.draw();

                // FIXED COLLISION LOGIC
                if (
                    mario.position.y + mario.height <= platform.position.y && 
                    mario.position.y + mario.height + mario.velocity.y >= platform.position.y &&
                    mario.position.x + mario.width >= platform.position.x + scrollOffset &&
                    mario.position.x <= platform.position.x + scrollOffset + platform.width
                ) {
                    mario.velocity.y = 0;
                    // Snap Mario to top of platform to prevent "jittering"
                    mario.position.y = platform.position.y - mario.height;
                }
            });

            mario.update();

            // INFINITE GENERATION
            const lastPlatform = platforms[platforms.length - 1];
            if (lastPlatform.position.x + scrollOffset < canvas.width + 200) {
                const newX = lastPlatform.position.x + lastPlatform.width + (Math.random() * 100 + 50);
                const newY = 150 + Math.random() * 200;
                platforms.push(new Platform({ x: newX, y: newY, width: 150 + Math.random() * 200, height: 20 }));
            }

            // Cleanup old platforms
            if (platforms.length > 20) platforms.shift();

            // MOVEMENT
            if (keys.right && mario.position.x < 400) {
                mario.velocity.x = mario.speed;
            } else if (keys.left && mario.position.x > 100) {
                mario.velocity.x = -mario.speed;
            } else {
                mario.velocity.x = 0;
                if (keys.right) {
                    scrollOffset -= mario.speed;
                    score++;
                    document.getElementById('score').innerText = Math.floor(score/10);
                } else if (keys.left && scrollOffset < 0) {
                    scrollOffset += mario.speed;
                }
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
            if ((e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') && mario.velocity.y === 0) {
                mario.velocity.y = -15;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
        });

        animate();
    </script>
</body>
</html>

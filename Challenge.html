<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Infinite Mario Clone</title>
    <style>
        body { margin: 0; background: #5c94fc; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; font-family: 'Courier New', Courier, monospace; }
        canvas { background: #5c94fc; border: 4px solid #000; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .ui { position: absolute; top: 20px; color: white; font-size: 24px; text-shadow: 2px 2px #000; pointer-events: none; }
    </style>
</head>
<body>
    <div class="ui">Distance: <span id="score">0</span>m</div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 800;
        canvas.height = 400;

        const gravity = 0.8;
        const keys = { right: false, left: false };
        let scrollOffset = 0;
        let score = 0;

        class Player {
            constructor() {
                this.width = 30;
                this.height = 40;
                this.position = { x: 100, y: 100 };
                this.velocity = { x: 0, y: 0 };
                this.speed = 6;
            }

            draw() {
                // Drawing a simple "Block Mario"
                // Hat
                ctx.fillStyle = "#FF0000";
                ctx.fillRect(this.position.x + 5, this.position.y, 20, 10);
                // Face/Skin
                ctx.fillStyle = "#FFCC99";
                ctx.fillRect(this.position.x + 5, this.position.y + 10, 20, 10);
                // Overalls
                ctx.fillStyle = "#0000FF";
                ctx.fillRect(this.position.x + 5, this.position.y + 20, 20, 15);
                // Shoes
                ctx.fillStyle = "#663300";
                ctx.fillRect(this.position.x + 2, this.position.y + 35, 10, 5);
                ctx.fillRect(this.position.x + 18, this.position.y + 35, 10, 5);
            }

            update() {
                this.draw();
                this.position.x += this.velocity.x;
                this.position.y += this.velocity.y;

                if (this.position.y + this.height + this.velocity.y <= canvas.height) {
                    this.velocity.y += gravity;
                } else {
                    // Fall into pit = Reset
                    this.reset();
                }
            }

            reset() {
                this.position = { x: 100, y: 100 };
                this.velocity = { x: 0, y: 0 };
                scrollOffset = 0;
                platforms = [new Platform({ x: 0, y: 350, width: 600, height: 50 })];
            }
        }

        class Platform {
            constructor({ x, y, width, height }) {
                this.position = { x, y };
                this.width = width;
                this.height = height;
            }
            draw() {
                ctx.fillStyle = '#8B4513'; // Brown dirt
                ctx.fillRect(this.position.x + scrollOffset, this.position.y, this.width, this.height);
                ctx.fillStyle = '#228B22'; // Green grass top
                ctx.fillRect(this.position.x + scrollOffset, this.position.y, this.width, 10);
            }
        }

        let mario = new Player();
        let platforms = [
            new Platform({ x: 0, y: 350, width: 600, height: 50 }),
            new Platform({ x: 700, y: 250, width: 200, height: 20 })
        ];

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. Draw and Manage Platforms
            platforms.forEach(platform => {
                platform.draw();

                // SOLID COLLISION LOGIC
                if (
                    mario.position.y + mario.height <= platform.y && 
                    mario.position.y + mario.height + mario.velocity.y >= platform.y &&
                    mario.position.x + mario.width >= platform.x + scrollOffset &&
                    mario.position.x <= platform.x + scrollOffset + platform.width
                ) {
                    mario.velocity.y = 0;
                }
            });

            mario.update();

            // 2. INFINITE GENERATION LOGIC
            // If the last platform is getting close to the screen, add a new one
            const lastPlatform = platforms[platforms.length - 1];
            if (lastPlatform.position.x + scrollOffset < canvas.width) {
                const newX = lastPlatform.position.x + lastPlatform.width + Math.random() * 150 + 50;
                const newY = 150 + Math.random() * 200;
                platforms.push(new Platform({ x: newX, y: newY, width: 150 + Math.random() * 200, height: 20 }));
            }

            // Clean up old platforms to save memory
            if (platforms.length > 20) platforms.shift();

            // 3. MOVEMENT & SCROLLING
            if (keys.right && mario.position.x < 400) {
                mario.velocity.x = mario.speed;
            } else if (keys.left && mario.position.x > 100) {
                mario.velocity.x = -mario.speed;
            } else {
                mario.velocity.x = 0;
                if (keys.right) {
                    scrollOffset -= mario.speed;
                    score++;
                    document.getElementById('score').innerText = Math.floor(score/10);
                } else if (keys.left && scrollOffset < 0) {
                    scrollOffset += mario.speed;
                }
            }
        }

        // INPUT LISTENERS
        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
            if ((e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') && mario.velocity.y === 0) {
                mario.velocity.y = -15;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
        });

        animate();
    </script>
</body>
</html>

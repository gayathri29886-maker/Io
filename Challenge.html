<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mario - Working Controls</title>
    <style>
        body { margin: 0; background: #5c94fc; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; font-family: Arial, sans-serif; }
        canvas { background: #5c94fc; border: 2px solid #000; cursor: pointer; }
        .instructions { color: white; margin-bottom: 10px; text-shadow: 1px 1px 2px black; }
    </style>
</head>
<body>
    <div class="instructions">Click the game area, then use <b>Arrow Keys</b> or <b>WASD</b> to move!</div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 800;
        canvas.height = 400;

        const gravity = 0.5;
        const keys = { right: false, left: false };
        let scrollOffset = 0;

        class Player {
            constructor() {
                this.width = 30;
                this.height = 30;
                this.position = { x: 100, y: 100 };
                this.velocity = { x: 0, y: 0 };
                this.speed = 5;
            }
            draw() {
                ctx.fillStyle = 'red';
                ctx.fillRect(this.position.x, this.position.y, this.width, this.height);
            }
            update() {
                this.draw();
                this.position.x += this.velocity.x;
                this.position.y += this.velocity.y;

                if (this.position.y + this.height + this.velocity.y <= canvas.height) {
                    this.velocity.y += gravity;
                } else {
                    this.velocity.y = 0;
                }
            }
        }

        class Platform {
            constructor({ x, y, width, height }) {
                this.position = { x, y };
                this.width = width;
                this.height = height;
            }
            draw() {
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(this.position.x, this.position.y, this.width, this.height);
            }
        }

        const mario = new Player();
        const platforms = [
            new Platform({ x: 0, y: 370, width: 5000, height: 30 }), // Long floor
            new Platform({ x: 400, y: 250, width: 200, height: 20 }),
            new Platform({ x: 800, y: 180, width: 200, height: 20 })
        ];

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.save();
            ctx.translate(scrollOffset, 0);
            platforms.forEach(platform => platform.draw());
            ctx.restore();

            mario.update();

            // Movement & Scrolling Logic
            if (keys.right && mario.position.x < 400) {
                mario.velocity.x = mario.speed;
            } else if (keys.left && mario.position.x > 100) {
                mario.velocity.x = -mario.speed;
            } else {
                mario.velocity.x = 0;
                if (keys.right) {
                    scrollOffset -= mario.speed;
                } else if (keys.left && scrollOffset < 0) {
                    scrollOffset += mario.speed;
                }
            }
        }

        // IMPROVED KEY LISTENERS
        window.addEventListener('keydown', (event) => {
            switch (event.code) {
                case 'KeyA':
                case 'ArrowLeft':
                    keys.left = true;
                    break;
                case 'KeyD':
                case 'ArrowRight':
                    keys.right = true;
                    break;
                case 'KeyW':
                case 'ArrowUp':
                case 'Space':
                    if (mario.velocity.y === 0) mario.velocity.y = -12;
                    break;
            }
        });

        window.addEventListener('keyup', (event) => {
            switch (event.code) {
                case 'KeyA':
                case 'ArrowLeft':
                    keys.left = false;
                    break;
                case 'KeyD':
                case 'ArrowRight':
                    keys.right = false;
                    break;
            }
        });

        animate();
    </script>
</body>
</html>

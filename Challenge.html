<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mario - Scrolling Movement</title>
    <style>
        body { margin: 0; background: #5c94fc; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { background: #5c94fc; border: 2px solid #000; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 800;
        canvas.height = 400;

        const gravity = 0.5;
        const keys = { right: false, left: false };
        let scrollOffset = 0; // Tracks how far we have moved in the level

        class Player {
            constructor() {
                this.width = 30;
                this.height = 30;
                this.position = { x: 100, y: 100 };
                this.velocity = { x: 0, y: 0 };
                this.speed = 5;
            }
            draw() {
                ctx.fillStyle = 'red';
                ctx.fillRect(this.position.x, this.position.y, this.width, this.height);
            }
            update() {
                this.draw();
                this.position.x += this.velocity.x;
                this.position.y += this.velocity.y;

                if (this.position.y + this.height + this.velocity.y <= canvas.height) {
                    this.velocity.y += gravity;
                } else {
                    this.velocity.y = 0;
                }
            }
        }

        class Platform {
            constructor({ x, y, width, height }) {
                this.position = { x, y };
                this.width = width;
                this.height = height;
            }
            draw() {
                ctx.fillStyle = '#8B4513'; // Dirt/Brick color
                ctx.fillRect(this.position.x, this.position.y, this.width, this.height);
            }
        }

        const mario = new Player();
        const platforms = [
            new Platform({ x: 0, y: 370, width: 2000, height: 30 }), // The Ground
            new Platform({ x: 400, y: 250, width: 200, height: 20 }), // A floating platform
            new Platform({ x: 700, y: 150, width: 200, height: 20 })
        ];

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. Draw Platforms (and adjust for scroll)
            ctx.save();
            ctx.translate(scrollOffset, 0); // Move everything based on scroll
            platforms.forEach(platform => platform.draw());
            ctx.restore();

            mario.update();

            // 2. SCROLLING LOGIC
            if (keys.right && mario.position.x < 400) {
                mario.velocity.x = mario.speed; // Move Mario right
            } else if (keys.left && mario.position.x > 100) {
                mario.velocity.x = -mario.speed; // Move Mario left
            } else {
                mario.velocity.x = 0;

                // If Mario is at the "scroll boundaries", move the world instead
                if (keys.right) {
                    scrollOffset -= mario.speed;
                } else if (keys.left && scrollOffset < 0) {
                    scrollOffset += mario.speed;
                }
            }
        }

        window.addEventListener('keydown', ({ keyCode }) => {
            if (keyCode === 68) keys.right = true; // D
            if (keyCode === 65) keys.left = true;  // A
            if ((keyCode === 87 || keyCode === 32) && mario.velocity.y === 0) mario.velocity.y = -12;
        });

        window.addEventListener('keyup', ({ keyCode }) => {
            if (keyCode === 68) keys.right = false;
            if (keyCode === 65) keys.left = false;
        });

        animate();
    </script>
</body>
</html>
